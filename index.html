<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>BestShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <nav class="nav">
      <p class="nav__logo">BestShop</p>
      <ul class="nav__links">
        <li class="links"><a href="#Why-us">Why us</a></li>
        <li class="links"><a href="#Benefits">Benefits</a></li>
        <li class="links"><a href="#Prices">Prices</a></li>
        <li class="links"><a href="#Contact">Contact</a></li>
      </ul>
    </nav>  <!-- end nav -->

    <header class="header">
      <h1>Sell More!</h1>
      <p class="header__text">Open shop on our platform and increase your sales</p>
      <a href="/openShop" class="btn">Open your shop</a>
      <img src="./assets/Background.png" alt="bg">
    </header> <!-- end header -->
    <br>
    <section class="section">
      <div class="section__statistics">
          <h2 class="statistics__header">The most popular sales platform in country</h2>
          <div class="statistics__icons">
            <div class="stat_box">
              <div class="circle_bg_red">
                <img class="stat__img" src="assets/Person.svg" alt="person">
              </div>
              <p class="statistics__numbers">100000+</p>
              <p class="statistics__text">daily entries</p>
            </div>
            <div class="stat_box">
              <div class="circle_bg_blue">
                <img class="stat__img" src="assets/Eye.svg" alt="eye">
              </div>
              <p class="statistics__numbers">2000000+</p>
              <p class="statistics__text">seen products every day</p>
            </div>
            <div class="stat_box">
              <div class="circle_bg_green">
                <img class="stat__img" src="assets/Catalog.svg" alt="catalog">
              </div>
              <p class="statistics__numbers">10000+</p>
              <p class="statistics__text">added posts daily</p>
            </div>
          </div>
       </div>
    </section> <!--end section statistics -->
    <br>
    <section class="section"> 
      <div class="section__benefits">
    
      </div>
    </section>
    <br>
    <section class="section">
     <div class="section__pricing">
    
      </div>
    </section>
    <br>
    <section class="section">
       <div class="section__contact">
    
      </div>
    </section>
    <br>
    <footer></footer>
  </div>
</body>
</html>
